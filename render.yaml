services:
  - type: web
    name: cksretrogarage
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      # Set in the Render dashboard to enable sourcing-form emails (see .env.example).
      - key: RESEND_API_KEY
        sync: false
